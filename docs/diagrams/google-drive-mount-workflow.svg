<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <rect width="1000" height="360" fill="#09090B" rx="16" />
  <text x="40" y="45" fill="#F4F4F5" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Google Drive Virtual Storage (G:) — WinFsp &amp; rclone Mount Workflow</text>
  <text x="40" y="68" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="13">Safe non-destructive virtual filesystem mounting and SHA-256 verified rclone copy backups</text>

  <rect x="40" y="110" width="200" height="180" rx="12" fill="#171619" stroke="#A855F7" stroke-width="1.5" />
  <text x="60" y="142" fill="#A855F7" font-family="Inter, sans-serif" font-size="13" font-weight="bold">1. PRE-MOUNT AUDIT</text>
  <text x="60" y="170" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Verify C:\rclone\rclone.exe</text>
  <text x="60" y="192" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Verify WinFsp 2024.1 driver</text>
  <text x="60" y="214" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Inspect gdrive: &amp; gdrive2:</text>
  <text x="60" y="236" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Detect 5 TiB shared pool</text>

  <rect x="280" y="110" width="210" height="180" rx="12" fill="#171619" stroke="#38BDF8" stroke-width="1.5" />
  <text x="300" y="142" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="bold">2. WINFSP VFS MOUNT</text>
  <text x="300" y="170" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Target Drive: G:\</text>
  <text x="300" y="192" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Root: Laptop_Full_Backup/</text>
  <text x="300" y="214" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• --vfs-cache-mode full</text>
  <text x="300" y="236" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• --network-mode enabled</text>

  <rect x="530" y="110" width="200" height="180" rx="12" fill="#171619" stroke="#10B981" stroke-width="1.5" />
  <text x="550" y="142" fill="#10B981" font-family="Inter, sans-serif" font-size="13" font-weight="bold">3. SAFE BACKUP (COPY)</text>
  <text x="550" y="170" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Strictly uses rclone copy</text>
  <text x="550" y="192" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Blocks rclone sync / move</text>
  <text x="550" y="214" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Preserves 1,063 objects</text>
  <text x="550" y="236" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Resumable chunk transfers</text>

  <rect x="770" y="110" width="190" height="180" rx="12" fill="#171619" stroke="#F59E0B" stroke-width="1.5" />
  <text x="790" y="142" fill="#F59E0B" font-family="Inter, sans-serif" font-size="13" font-weight="bold">4. SHA-256 VERIFY</text>
  <text x="790" y="170" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• rclone check --one-way</text>
  <text x="790" y="192" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• Hash parity confirmation</text>
  <text x="790" y="214" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• SQLite mount_history log</text>
  <text x="790" y="236" fill="#E4E4E7" font-family="Inter, sans-serif" font-size="11">• File Explorer G:\ ready</text>
</svg>
