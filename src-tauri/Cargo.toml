[package]
name = "system-command-center"
version = "2.5.0"
description = "Unified Windows 11 System Intelligence, Google Drive Virtual Storage and Local Command Execution Desktop Application"
authors = ["System Command Center Engineering"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

