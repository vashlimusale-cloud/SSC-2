name: Build Native Windows 11 Tauri Desktop Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable Toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies & Run Unit Tests
        run: |
          npm ci
          npx tsx --test src/utils/systemIntelligence.test.ts src/utils/storageIntelligence.test.ts

      - name: Build Tauri 2 Native Windows Executable & Installers (.exe / .msi)
        run: |
          npm install -D @tauri-apps/cli@^2.0.0
          npx tauri build

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: System-Command-Center-v2.5.0-Windows-x64-Installers
          path: |
            src-tauri/target/release/system-command-center.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
